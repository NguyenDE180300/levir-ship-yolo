# Local chroma contrast classification guidance at P2/P3; ASF disabled.
nc: 1
ftsc: {enabled: true, policy: f5, evidence: [position_gaussian, dfl_distribution], position_alpha: 6.0, dfl_entropy_tau: 1.0, dfl_variance_tau: 0.0, dfl_detach: true, dfl_apply_cls: true, dfl_apply_box: false, dfl_apply_dfl: false, log_clip: 0.35, per_gt_norm: true, apply_cls: true, apply_box: true, apply_dfl: true, warmup_epochs: 5, ramp_epochs: 10, strength_init: 1.0, strength_max: 2.0, strength_reg_weight: 0.0001, fixed_strengths: {dfl_distribution: 1.0}}
scale: n
scales: {n: [0.33, 0.25, 1024]}
backbone:
  - [-1, 1, nn.Identity, []]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]
  # Compute C_full once, but do not inject it into the shared backbone/FPN.
  - [0, 1, LocalChromaContrast9x9, []]
  - [3, 1, SENetV2EnSimAM, []]
  - [5, 1, SENetV2EnSimAM, []]
head:
  - [10, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]
  # Independent direct resize from C_full for each final classification level.
  - [[22, 11], 1, LocalChromaClsGuidance, [32]]
  - [[19, 11], 1, LocalChromaClsGuidance, [32]]
  - [[16, 11], 1, LocalChromaClsGuidance, [32]]
  - [[22, 23, 19, 24, 16, 25], 1, ContrastClsFTSCDetect, [nc]]
