# Reference GAP+Factorized TAL K15 FPN-only topology plus a verified ASRM residual after F2.
nc: 1
p2_offset_regression: false
scale: n
scales: {n: [0.33, 0.25, 1024]}
backbone:
  - [-1, 1, nn.Identity, []] # 0 raw image; stock backbone is shifted to 1..10
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]] # 3 raw P2
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]] # 5 raw P3
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]] # 7 raw P4
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]] # 10 P5
  - [[3, 0], 1, ASRMStructuralPrior, [32, "adaptive", "window", 8]] # 11 A2
head:
  - [10, 1, nn.Upsample, [null, 2, nearest]] # 12 P5 -> P4
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 14 FPN P4
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 15 P4 -> P3
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # 17 FPN P3
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 18 P3 -> P2
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [128]] # 20 F2_base, unchanged reference P2 fusion
  - [[20, 3, 7, 11], 1, ASRMP4SemanticVerifyResidual, [32]] # 21 F2_out
  - [-1, 1, ChannelAttention, []] # 22 GAP
  - [[22], 1, Detect, [nc]] # P2-only Detect, stride 4
