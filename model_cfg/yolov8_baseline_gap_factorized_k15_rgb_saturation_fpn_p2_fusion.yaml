# RGB-only backbone. Saturation is injected exactly once at final FPN P3→P2 fusion.
nc: 1
p2_offset_regression: false
scale: n
scales: {n: [0.33, 0.25, 1024]}
backbone:
  - [-1, 1, nn.Identity, []] # 0 raw RGB exclusively for the saturation cue
  - [-1, 1, Conv, [64, 3, 2]] # main backbone remains RGB 3-channel
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]] # 3 P2 backbone
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]] # 5 P3 backbone
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]] # 7 P4 backbone
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]] # 10 P5
head:
  - [0, 1, SaturationP2Cue, [16, 0.1]] # 11 alpha*S2, only saturation use
  - [10, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 14 FPN P4
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # 17 FPN P3
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 18 Up(F3)
  - [[-1, 3, 11], 1, Concat, [1]] # Up(F3), raw P2 backbone, alpha*S2
  - [-1, 3, C2f, [128]] # 20 final F2
  - [-1, 1, ChannelAttention, []]
  - [[21], 1, Detect, [nc]] # P2-only stride 4
