# Input-guided context-refined P2'/P3' with GAP channel gates and Factorized TAL.
# FTAL settings are supplied by run_experiment.py, keeping this model YAML topology-only.
nc: 1
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, nn.Identity, []] # 0 raw image
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]] # 3 raw P2
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]] # 5 raw P3
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]] # 7 P4 context
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 10 P5 context
  - [[3, 5, 3, 7, 10, 0], 1, InputGuidedContextRefine, [32, "adaptive", "window", 8, 0.0, False]] # 11 P2'
  - [[5, 3, 3, 7, 10, 0], 1, InputGuidedContextRefine, [32, "adaptive", "window", 8, 0.0, False]] # 12 P3'
  - [11, 1, ChannelAttention, []] # 13 GAP-gated P2'
  - [12, 1, ChannelAttention, []] # 14 GAP-gated P3'

head:
  # P4/P5 are context-only: they never enter the detection pyramid directly.
  # Match the reference Varroa case: GAP-gated P2' and P3' feed Detect directly.
  - [[13, 14], 1, Detect, [nc]]
