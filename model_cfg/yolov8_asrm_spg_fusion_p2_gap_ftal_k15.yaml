# Reference GAP+FTAL K15 with structural-prior-guided replacement of final P3->P2 fusion.
# P5->P4->P3 FPN, GAP, and P2-only Detect are otherwise identical to the reference control.
nc: 1
p2_offset_regression: false
scale: n
scales: {n: [0.33, 0.25, 1024]}
backbone:
  - [-1, 1, nn.Identity, []] # 0 raw image tap; stock backbone shifts to 1..10
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]] # 3 raw P2
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]] # 5 raw P3
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]] # 7 raw P4
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]] # 10 P5
  - [[3, 0], 1, ASRMStructuralPrior, [32, "adaptive", "window", 8]] # 11 A2 [B,1,H/4,W/4]
head:
  - [10, 1, nn.Upsample, [null, 2, nearest]] # 12 P5 -> P4
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 14 FPN P4
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 15 P4 -> P3
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # 17 FPN P3 semantic feature
  - [[3, 17, 11], 1, SPGFusion, [128]] # 18 replaces P3->P2 Upsample+Concat+C2f
  - [-1, 1, ChannelAttention, []] # 19 GAP
  - [[19], 1, Detect, [nc]] # P2-only Detect, stride 4
