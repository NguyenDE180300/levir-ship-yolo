# ASRM candidates -> P2/P3 detail + P4/P5 background prototypes -> sparse refine.
# Raw ASRM residual is verifier evidence only; it is never detection feature content.
nc: 1
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, nn.Identity, []] # 0 raw image
  - [-1, 1, Conv, [64, 3, 2]] # 1
  - [-1, 1, Conv, [128, 3, 2]] # 2
  - [-1, 3, C2f, [128, True]] # 3 P2
  - [-1, 1, Conv, [256, 3, 2]] # 4
  - [-1, 6, C2f, [256, True]] # 5 P3
  - [-1, 1, Conv, [512, 3, 2]] # 6
  - [-1, 6, C2f, [512, True]] # 7 P4
  - [-1, 1, Conv, [1024, 3, 2]] # 8
  - [-1, 3, C2f, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10 P5
  # args: embed, prototypes, candidates, threshold, sigma, SRM mode, gamma, debug
  # Recall-oriented filter: top-96 local maxima, normalized threshold 0.25.
  - [[3, 5, 7, 10, 0], 1, ASRMCandidateSparseRefine, [32, 8, 96, 0.25, 1.5, "adaptive", 0.0, False]] # 11 P2'
  - [[5, 3, 7, 10, 0], 1, ASRMCandidateSparseRefine, [32, 8, 96, 0.25, 1.5, "adaptive", 0.0, False]] # 12 P3'

head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[21, 24, 27, 30], 1, Detect, [nc]]
