# YOLOv8_Input_ASRM_Attention_Guided_P2P3 (Version 3, extended to P2 + P3)
# Base: ultralytics/cfg/models/v8/yolov8-p2.yaml.
#
# Same raw-image tap trick as yolov8_input_asrm_auxiliary.yaml (layer 0 is an
# `nn.Identity` re-emitting the model input; layers 11/12 read `f: [level_index, 0]` via
# Ultralytics' existing multi-source gather, no wrapper Model needed).
#
# Two independent InputASRMAttentionGuidedP2 taps (same module class, reused as-is --
# it only needs a channel count, not P2-specific in code): layer 11 for P2, layer 12 for
# P3. Neither is a dead-end: P2' replaces P2 in the neck's lateral connection (layer 20),
# P3' replaces P3 in the neck's lateral connection (layer 17), and both run in train and
# eval (no eval-skip flag). The backbone trunk that produces P3/P4/P5 from raw P2 still
# reads the RAW P2 (layer 3) directly, unaffected -- only the shallow P2/8-xsmall and
# P3/8-small detection branches see the guided features; P4/P5 are never touched.

nc: 1 # LEVIR-Ship: single 'ship' class
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, nn.Identity, []] # 0, raw input image tap (re-used by layers 11/12 via index 0)
  - [-1, 1, Conv, [64, 3, 2]] # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 2-P2/4
  - [-1, 3, C2f, [128, True]] # 3 (raw P2, feeds P3 trunk unchanged)
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 6, C2f, [256, True]] # 5 (raw P3, feeds P4 trunk unchanged)
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 6, C2f, [512, True]] # 7
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 3, C2f, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10
  # InputASRMAttentionGuidedP2's first positional arg (level channel count) is
  # auto-injected from `ch[f[0]]`; yaml args are (embed_channels, srm_mode,
  # attention_type, fusion_mode, gamma_init, window_size, debug).
  - [[3, 0], 1, InputASRMAttentionGuidedP2,
     [64, "adaptive", "window", "residual_injection", 0.0, 8, False]] # 11 (P2' = guided P2)
  - [[5, 0], 1, InputASRMAttentionGuidedP2,
     [64, "adaptive", "window", "residual_injection", 0.0, 8, False]] # 12 (P3' = guided P3)

head:
  # Explicit `10` (not implicit -1): layers 11-12 (the two guided taps) sit between the
  # backbone and the head, so -1 here would wrongly resolve to layer 12.
  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 7], 1, Concat, [1]] # 14, cat backbone P4
  - [-1, 3, C2f, [512]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 12], 1, Concat, [1]] # 17, cat guided P3' (NOT raw backbone P3)
  - [-1, 3, C2f, [256]] # 18

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [[-1, 11], 1, Concat, [1]] # 20, cat guided P2' (NOT raw backbone P2)
  - [-1, 3, C2f, [128]] # 21 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]] # 22
  - [[-1, 18], 1, Concat, [1]] # 23, cat head P3
  - [-1, 3, C2f, [256]] # 24 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 25
  - [[-1, 15], 1, Concat, [1]] # 26, cat head P4
  - [-1, 3, C2f, [512]] # 27 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 28
  - [[-1, 10], 1, Concat, [1]] # 29, cat backbone P5
  - [-1, 3, C2f, [1024]] # 30 (P5/32-large)

  - [[21, 24, 27, 30], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
