# Canonical fixed SRM-3 F2 guidance with a deliberately low-capacity regularized mask branch.
nc: 1
p2_offset_regression: false
scale: n
scales: {n: [0.33, 0.25, 1024]}
backbone:
  - [-1, 1, nn.Identity, []]
  - [-1, 1, RGBColorAugment, [true, false]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]
head:
  - [11, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [128]] # 20 F2_base
  - [[20, 0], 1, SRMF2Guidance, [srm3, 16, 0.10, 0.5, false]] # bounded gamma, F2_out
  - [-1, 1, ChannelAttention, []]
  - [[22], 1, Detect, [nc]]
