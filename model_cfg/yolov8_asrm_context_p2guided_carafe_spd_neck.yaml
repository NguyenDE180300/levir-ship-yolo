# P2'-guided CARAFE with an explicit SPD route carrying P2' into P3 and P4.
# The regular PAN bottom-up path is retained alongside the direct P2' route.
nc: 1
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]
backbone:
  - [-1, 1, nn.Identity, []]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [[3, 5, 3, 7, 10, 0], 1, InputGuidedContextRefine, [32, "adaptive", "window", 8, 0.0, False]]
  - [[5, 3, 3, 7, 10, 0], 1, InputGuidedContextRefine, [32, "adaptive", "window", 8, 0.0, False]]
head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [[18, 11], 1, P2GuidedCARAFE, [2, 64, 3, 5]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]
  # Direct detail route: P2' -> R3, independently of the mixed P2 detection feature.
  - [11, 1, SPDConv, [128, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  # Carry the same direct P2' route one level deeper: R3 -> R4.
  - [22, 1, SPDConv, [256, 3, 2]]
  # Standard PAN contribution P3 -> P4 remains a separate path.
  - [24, 1, SPDConv, [256, 3, 2]]
  - [[-1, 15, 25], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, SPDConv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[21, 24, 28, 31], 1, Detect, [nc]]
