# RGB + Saturation + inference-visible IoU quality head.
# Topology is identical to yolov8_baseline_gap_factorized_k15_rgb_saturation.yaml.
nc: 1
scale: n
scales: {n: [0.33, 0.25, 1024]}
p2_offset_regression: false

# Existing Detect quality branch. Training uses the repository's IoU target/loss
# with the conservative default quality_gain=0.5; inference score is cls * quality.
quality_head: true
quality_score_mode: cls_mul_q
quality_box_features: false
quality_box_detach: true
quality_gain: 0.5
quality_neg_gain: 0.10
quality_loss: bce
quality_neg_mode: all
quality_detach_target: true

backbone:
  - [-1, 1, RGBColorAugment, [true, false]] # RGB + saturation = 4 channels
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]
head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]
  - [-1, 1, ChannelAttention, []]
  - [[20], 1, Detect, [nc]]
