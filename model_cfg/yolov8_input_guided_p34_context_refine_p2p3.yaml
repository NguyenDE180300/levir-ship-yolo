# Full YOLOv8n-P2 PAN-FPN ablation.
# P3' is built with the original A2-guided context-refine path.  P2' retains
# P2 detail and uses P3'/P4 as background context; P5 remains in the original
# top-down PAN-FPN path and is still a Detect level.
nc: 1
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, nn.Identity, []] # 0 raw image
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]] # 3 raw P2 detail
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]] # 5 raw P3
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]] # 7 P4 context
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 10 P5 retained
  # Original A2-driven P3' creation: P5 participates here.
  - [[5, 3, 3, 7, 10, 0], 1, InputGuidedContextRefine, [32, "adaptive", "window", 8, 0.0, False]] # 11 P3'
  # P2 keeps detail; P3' and P4 provide background/context verification.
  - [[3, 11, 7, 0], 1, InputGuidedP34ContextRefine, [32, "adaptive", "window", 8, 0.0, False]] # 12 P2'

head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # 13 P5 -> P4
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 15 top-down P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16 P4 -> P3
  - [[-1, 11], 1, Concat, [1]] # 17 uses P3'
  - [-1, 3, C2f, [256]] # 18 top-down P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19 P3 -> P2
  - [[-1, 12], 1, Concat, [1]] # 20 uses P2'
  - [-1, 3, C2f, [128]] # 21 top-down P2
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # 24 bottom-up P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 27 bottom-up P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]] # 30 bottom-up P5
  - [[21, 24, 27, 30], 1, Detect, [nc]]
