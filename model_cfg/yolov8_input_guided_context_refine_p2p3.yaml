# Image-guided P2 attention + P2/P3 detail + P4/P5 context -> one-shot P2/P3 refine.
# There is deliberately no image-guided P3 branch and no raw SRM residual injection.
nc: 1
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, nn.Identity, []] # 0 raw image
  - [-1, 1, Conv, [64, 3, 2]] # 1
  - [-1, 1, Conv, [128, 3, 2]] # 2
  - [-1, 3, C2f, [128, True]] # 3 raw P2; only source of input-guided attention
  - [-1, 1, Conv, [256, 3, 2]] # 4
  - [-1, 6, C2f, [256, True]] # 5 raw P3 detail
  - [-1, 1, Conv, [512, 3, 2]] # 6
  - [-1, 6, C2f, [512, True]] # 7 P4 context
  - [-1, 1, Conv, [1024, 3, 2]] # 8
  - [-1, 3, C2f, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10 P5 context
  # inputs: target, peer detail, guidance P2, P4, P5, raw image
  # args: embed, SRM mode, attention type, window, gamma, debug
  - [[3, 5, 3, 7, 10, 0], 1, InputGuidedContextRefine, [32, "adaptive", "window", 8, 0.0, False]] # 11 P2'
  - [[5, 3, 3, 7, 10, 0], 1, InputGuidedContextRefine, [32, "adaptive", "window", 8, 0.0, False]] # 12 P3'

head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 7], 1, Concat, [1]] # 14
  - [-1, 3, C2f, [512]] # 15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 12], 1, Concat, [1]] # 17 refined P3
  - [-1, 3, C2f, [256]] # 18
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [[-1, 11], 1, Concat, [1]] # 20 refined P2
  - [-1, 3, C2f, [128]] # 21
  - [-1, 1, Conv, [128, 3, 2]] # 22
  - [[-1, 18], 1, Concat, [1]] # 23
  - [-1, 3, C2f, [256]] # 24
  - [-1, 1, Conv, [256, 3, 2]] # 25
  - [[-1, 15], 1, Concat, [1]] # 26
  - [-1, 3, C2f, [512]] # 27
  - [-1, 1, Conv, [512, 3, 2]] # 28
  - [[-1, 10], 1, Concat, [1]] # 29
  - [-1, 3, C2f, [1024]] # 30
  - [[21, 24, 27, 30], 1, Detect, [nc]]
