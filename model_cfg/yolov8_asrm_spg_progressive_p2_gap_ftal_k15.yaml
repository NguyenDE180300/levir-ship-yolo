# Prepared only (not registered for training): progressive structural-prior fusion.
# A3 is learned from A2; SPGFusion runs P4->P3 then F3->P2; Detect remains P2-only.
nc: 1
p2_offset_regression: false
scale: n
scales: {n: [0.33, 0.25, 1024]}
backbone:
  - [-1, 1, nn.Identity, []]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]] # 3 P2
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]] # 5 P3
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]] # 7 P4
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]] # 10 P5
  - [[3, 0], 1, ASRMStructuralPrior, [32, "adaptive", "window", 8]] # 11 A2
head:
  - [10, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 14 FPN P4
  - [11, 1, ASRMDetailPriorDownsample, []] # 15 A3
  - [[5, 14, 15], 1, SPGFusion, [256]] # 16 F3
  - [[3, 16, 11], 1, SPGFusion, [128]] # 17 F2
  - [-1, 1, ChannelAttention, []]
  - [[18], 1, Detect, [nc]]
