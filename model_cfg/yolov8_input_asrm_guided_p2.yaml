# YOLOv8_Input_ASRM_Attention_Guided_P2 (Version 3, P2 only)
# Base: ultralytics/cfg/models/v8/yolov8-p2.yaml.
#
# Same raw-image tap trick as yolov8_input_asrm_auxiliary.yaml (layer 0 is an
# `nn.Identity` re-emitting the model input; layer 11 reads `f: [3, 0]` = [P2, image]
# via Ultralytics' existing multi-source gather, no wrapper Model needed).
#
# Difference from Version 2: InputASRMAttentionGuidedP2 (layer 11) is NOT a dead-end.
# Its guided output P2' replaces P2 in the neck's lateral connection (layer 19), and it
# runs in both train and eval (no eval-skip flag). The backbone trunk that produces
# P3/P4/P5 still reads the RAW P2 (layer 3) directly, unaffected -- only the shallow
# P2/4-xsmall detection branch sees the guided feature.
#
# See yolov8_input_asrm_guided_p2p3.yaml for the sibling variant that adds a second,
# independent tap on P3 as well (same InputASRMAttentionGuidedP2 class, reused as-is).

nc: 1 # LEVIR-Ship: single 'ship' class
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, nn.Identity, []] # 0, raw input image tap (re-used by layer 11 via index 0)
  - [-1, 1, Conv, [64, 3, 2]] # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 2-P2/4
  - [-1, 3, C2f, [128, True]] # 3 (raw P2, feeds P3 trunk unchanged)
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 6, C2f, [256, True]] # 5
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 6, C2f, [512, True]] # 7
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 3, C2f, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10
  # InputASRMAttentionGuidedP2 first positional arg (P2 channel count) is
  # auto-injected from `ch[f[0]]`; yaml args are (embed_channels, srm_mode,
  # attention_type, fusion_mode, gamma_init, window_size, debug).
  - [[3, 0], 1, InputASRMAttentionGuidedP2,
     [64, "adaptive", "window", "residual_injection", 0.0, 8, False]] # 11 (P2' = guided P2)

head:
  # Explicit `10` (not implicit -1): layer 11 (InputASRMAttentionGuidedP2) sits
  # between the backbone and the head, so -1 here would wrongly resolve to it
  # instead of SPPF.
  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 7], 1, Concat, [1]] # 13, cat backbone P4
  - [-1, 3, C2f, [512]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 5], 1, Concat, [1]] # 16, cat backbone P3
  - [-1, 3, C2f, [256]] # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 11], 1, Concat, [1]] # 19, cat guided P2' (NOT raw backbone P2)
  - [-1, 3, C2f, [128]] # 20 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]] # 21
  - [[-1, 17], 1, Concat, [1]] # 22, cat head P3
  - [-1, 3, C2f, [256]] # 23 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 14], 1, Concat, [1]] # 25, cat head P4
  - [-1, 3, C2f, [512]] # 26 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 27
  - [[-1, 10], 1, Concat, [1]] # 28, cat backbone P5
  - [-1, 3, C2f, [1024]] # 29 (P5/32-large)

  - [[20, 23, 26, 29], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
